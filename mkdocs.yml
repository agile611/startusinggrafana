site_name: Curso de Grafana
site_description: Curso práctico de Grafana sobre Ubuntu 24.04.5 LTS
site_author: Guillem Hernandez Sola
site_url: https://agile611.github.io/startusinggrafana/

repo_name: agile611/startusinggrafana
repo_url: https://github.com/agile611/startusinggrafana

docs_dir: docs
site_dir: site

theme:
  name: material
  language: es

  logo: https://www.agile611.com/wp-content/uploads/2020/09/Negativo.png
  favicon: https://www.agile611.com/wp-content/uploads/2019/07/cropped-agile611-1-e1563910774746-1-32x32.png

  font:
    text: Nunito
    code: Nunito

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

  icon:
    logo: material/chart-timeline-variant
    repo: fontawesome/brands/github

  static_templates: []

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list

  - toc:
      permalink: true
      toc_depth: 3

  - pymdownx.details
  - pymdownx.superfences

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span

  - pymdownx.inlinehilite

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - es

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/js/custom.js

